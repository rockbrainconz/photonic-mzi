name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The all-frame glyph scan runs once on Linux. Install the font before the first
      # Matplotlib process so its font cache includes the Chinese translation glyphs.
      - name: Install CJK font
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: Fast tests (excluding expensive rendering)
        run: pytest -m "not slow" -q

      - name: Full tests (all-frame scan and GIF export)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: pytest -q
        env:
          MPLBACKEND: Agg

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      # Formatting is intentionally manual for aligned matrices and teaching comments.

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run every example
        run: |
          for f in examples/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
