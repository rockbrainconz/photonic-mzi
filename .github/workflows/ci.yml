name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 快速测试（不含重型渲染）
        run: pytest -m "not slow" -q

      # 全帧字形扫描依赖字体，只在 Linux 上跑一次即可。
      # 中文字形缺失会让动画渲染出方框，这是必须守住的回归。
      - name: 安装中日韩字体
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 完整测试（含全帧扫描与 GIF 导出）
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: pytest -q
        env:
          MPLBACKEND: Agg

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      # 不跑 ruff format --check：本项目的代码排版（矩阵字面量对齐、
      # 教学注释的缩进）是刻意的，交给自动格式化会破坏可读性。

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: 跑一遍所有示例
        run: |
          for f in examples/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
