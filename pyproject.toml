[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photonic-mzi"
version = "1.0.0"
description = "Circuit-level validation of photonic matrix multiply-accumulate"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "yaoniming3k" }]
keywords = [
    "photonics", "optical-computing", "mzi", "mach-zehnder",
    "svd", "unitary-decomposition", "reck", "simulation", "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "pillow>=9.0"]
dev = ["pytest>=7.0", "matplotlib>=3.6", "pillow>=9.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/yaoniming3k/photonic-mzi"
Documentation = "https://github.com/yaoniming3k/photonic-mzi#readme"
Repository = "https://github.com/yaoniming3k/photonic-mzi"
Issues = "https://github.com/yaoniming3k/photonic-mzi/issues"
Changelog = "https://github.com/yaoniming3k/photonic-mzi/blob/main/CHANGELOG.md"

[project.scripts]
photonic-mzi = "photonic_mzi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --doctest-glob='' --strict-markers"
markers = [
    "slow: expensive rendering tests (all-frame scan and GIF export); skip with -m 'not slow'",
]
filterwarnings = [
    "error::UserWarning",
    # Expected Matplotlib behavior with a non-interactive backend.
    "ignore:Animation was deleted without rendering anything:UserWarning",
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # Enforce line length through the configured line-length value.
    "B008",
    # Animation frames intentionally use readable dict(stage=..., narr=...) calls.
    "C408",
]
